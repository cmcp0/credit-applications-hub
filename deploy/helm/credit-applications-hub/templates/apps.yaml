apiVersion: v1
kind: Service
metadata:
  name: {{ include "credit-applications-hub.backendHost" . }}
  labels:
    {{- include "credit-applications-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "credit-applications-hub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "credit-applications-hub.backendHost" . }}
  labels:
    {{- include "credit-applications-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "credit-applications-hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "credit-applications-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: {{ printf "%s:%s" .Values.images.python.repository .Values.images.python.tag }}
          imagePullPolicy: {{ .Values.images.python.pullPolicy }}
          command: ["uvicorn", "apps.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef:
                name: {{ include "credit-applications-hub.commonEnvConfigMapName" . }}
            - secretRef:
                name: {{ include "credit-applications-hub.commonEnvSecretName" . }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10

